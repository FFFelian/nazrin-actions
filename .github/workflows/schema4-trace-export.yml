name: Schema-4 structured trace export

'on':
  workflow_dispatch:
    inputs:
      slice:
        description: Repository-relative theorem-list TSV with theorem and module columns
        required: true
        type: string
        default: paper-overlay/paper-slices/slice-00.tsv
      shard_count:
        description: Number of contiguous deterministic shards (1 to 20)
        required: true
        type: number
        default: 20
      max_parallel:
        description: Maximum simultaneous shard jobs (1 to 20)
        required: true
        type: number
        default: 20
      start:
        description: First slice data row of the export window (inclusive)
        required: true
        type: number
        default: 0
      end:
        description: Last slice data row of the export window (exclusive; -1 = all)
        required: true
        type: number
        default: -1
      limit:
        description: 每 shard 最大 theorem 行数（0=全部）
        required: true
        type: number
        default: 0
      heartbeats:
        description: Per-theorem Lean heartbeat cap
        required: true
        type: number
        default: 200000
      timeout_seconds:
        description: Per-theorem wall-clock timeout in seconds
        required: true
        type: number
        default: 180
      source_ref:
        description: Full pinned Codeberg Nazrin base commit SHA
        required: true
        type: string
        default: e34a0535fc767479f7939a98f5699b1a6513a919
      runner_label:
        description: Linux x64 runner label with sufficient memory and disk
        required: true
        type: string
        default: ubuntu-24.04

permissions:
  contents: read

concurrency:
  group: schema4-trace-export-${{ github.run_id }}
  cancel-in-progress: false

env:
  NAZRIN_SOURCE_URL: https://codeberg.org/aniva/Nazrin.git
  NAZRIN_SOURCE_REF: ${{ inputs.source_ref }}
  LEAN_TASK_MANAGER_WORKERS: '2'
  PYTHONDONTWRITEBYTECODE: '1'
  JOBS: '2'
  ENVELOPE_SCHEMA: '3'

jobs:
  prepare:
    name: Build exporter and plan shards
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 360
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
      max_parallel: ${{ steps.validate.outputs.max_parallel }}
      shard_count: ${{ steps.validate.outputs.shard_count }}
      limit: ${{ steps.validate.outputs.limit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Resolve pinned runtime manifest
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          manifest = json.loads(Path("runtime/manifest.json").read_text(encoding="utf-8"))
          if manifest.get("schema") != 1:
              raise SystemExit("runtime/manifest.json schema must be 1")
          source = manifest.get("source_commit")
          mathlib = manifest.get("mathlib_commit")
          for label, value in (("source_commit", source), ("mathlib_commit", mathlib)):
              if not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{40}", value):
                  raise SystemExit(f"runtime manifest {label} must be a full 40-character SHA")
          requested = os.environ["SOURCE_REF"]
          if requested.lower() != source:
              raise SystemExit(
                  f"requested source_ref {requested} is not the runtime-pinned {source}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"NAZRIN_SOURCE_REF={source}\n")
              handle.write(f"MATHLIB_COMMIT={mathlib}\n")
          PY
      - name: Record export limits in job summary
        run: |
          {
            echo "### Schema-4 structured trace export"
            echo ""
            echo "- Exporter: \`Standalone/StructuredTraceV4.lean\` (schema_version 4)"
            echo "- Shards: $SHARD_COUNT, max parallel: $MAX_PARALLEL"
            echo "- Theorem rows per shard: \`limit\` input (default 0 = all rows)"
            echo "- Heartbeats per theorem: $HEARTBEATS"
            echo "- Wall-clock timeout per theorem: ${TIMEOUT_SECONDS}s"
            echo "- Step cap per theorem: 3000 (paper §VI p.8)"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          SHARD_COUNT: ${{ inputs.shard_count }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
          HEARTBEATS: ${{ inputs.heartbeats }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}

      - name: Validate dispatch inputs and slice window
        id: validate
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          SHARD_COUNT: ${{ inputs.shard_count }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          LIMIT: ${{ inputs.limit }}
          HEARTBEATS: ${{ inputs.heartbeats }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          RUNNER_LABEL: ${{ inputs.runner_label }}
          SLICE_PATH: ${{ inputs.slice }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          def integer(name, low, high):
              raw = os.environ[name]
              if not re.fullmatch(r"-?\d+", raw):
                  raise SystemExit(f"{name} must be an integer")
              value = int(raw)
              if not low <= value <= high:
                  raise SystemExit(f"{name} must be between {low} and {high}")
              return value

          if not re.fullmatch(r"[0-9a-fA-F]{40}", os.environ["SOURCE_REF"]):
              raise SystemExit("SOURCE_REF must be a full 40-character Git commit SHA")
          shard_count = integer("SHARD_COUNT", 1, 20)
          max_parallel = integer("MAX_PARALLEL", 1, 20)
          start = integer("START", 0, 10_000_000)
          end = integer("END", -1, 10_000_000)
          limit = integer("LIMIT", 0, 1_000_000)
          integer("HEARTBEATS", 1, 10_000_000)
          integer("TIMEOUT_SECONDS", 1, 86_400)
          if not re.fullmatch(r"[A-Za-z0-9._/-]+", os.environ["RUNNER_LABEL"]):
              raise SystemExit("RUNNER_LABEL contains unsupported characters")

          raw = os.environ["SLICE_PATH"]
          relative = Path(raw)
          if not raw or relative.is_absolute() or ".." in relative.parts:
              raise SystemExit("SLICE_PATH must be a repository-relative path without '..'")
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          candidate = workspace / relative
          if candidate.is_symlink():
              raise SystemExit("SLICE_PATH must not be a symlink")
          try:
              candidate = candidate.resolve(strict=True)
          except FileNotFoundError:
              raise SystemExit(f"SLICE_PATH does not exist: {raw}") from None
          try:
              candidate.relative_to(workspace)
          except ValueError:
              raise SystemExit("SLICE_PATH escapes the repository workspace") from None
          if not candidate.is_file():
              raise SystemExit("SLICE_PATH must name a regular file")

          lines = candidate.read_text(encoding="utf-8-sig").splitlines()
          if len(lines) < 2:
              raise SystemExit("SLICE_PATH has no theorem rows")
          header = lines[0].split("\t")
          for column in ("theorem", "module"):
              if column not in header:
                  raise SystemExit(f"SLICE_PATH header has no '{column}' column")
          rows = [line for line in lines[1:] if line.strip()]
          if not rows:
              raise SystemExit("SLICE_PATH has no theorem rows")
          stop = len(rows) if end < 0 else min(end, len(rows))
          if stop <= start:
              raise SystemExit("the requested slice window is empty")
          window = rows[start:stop]
          if not window:
              raise SystemExit("the requested slice window is empty")
          if shard_count > len(window):
              raise SystemExit("shard_count exceeds the window's theorem rows; empty shards are not supported")
          if limit:
              window = window[: min(len(window), limit * shard_count)]
          plan_dir = workspace / "plan"
          plan_dir.mkdir(parents=True, exist_ok=True)
          (plan_dir / "input-window.tsv").write_text(
              "\n".join([lines[0], *window]) + "\n", encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"slice={candidate.relative_to(workspace).as_posix()}\n")
              output.write(f"shard_count={shard_count}\n")
              output.write(f"max_parallel={max_parallel}\n")
              output.write(f"limit={limit}\n")
              output.write(f"window_rows={len(window)}\n")
          PY

      - name: Verify overlay checksums
        run: |
          set -Eeuo pipefail
          cd paper-overlay
          sha256sum -c SHA256SUMS

      - name: Ensure PyYAML for workflow self-checks
        continue-on-error: true
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      - name: Run schema-4 unit tests
        run: python3 -B -m unittest discover -s tests -p 'test_schema4_trace_export.py' -v

      - name: Bootstrap pinned Nazrin and Mathlib runtime
        timeout-minutes: 300
        env:
          GENERATE_INVENTORY: 'false'
        run: bash scripts/setup_runtime.sh

      - name: Apply schema-4 overlay and build the exporter
        env:
          OVERLAY_DIR: ${{ github.workspace }}/paper-overlay
        run: |
          set -Eeuo pipefail
          test -d "$NAZRIN_DIR/Standalone"
          test -f "$OVERLAY_DIR/lakefile.schema4.append"
          for name in GoalGraphCore.lean ExprGraphV2.lean ExprGraphV3.lean StructuredTraceV4.lean; do
            cp -a "$OVERLAY_DIR/Standalone/$name" "$NAZRIN_DIR/Standalone/$name"
          done
          if [[ ! -e "$NAZRIN_DIR/Standalone/AtomizerCore.lean" ]]; then
            echo "AtomizerCore.lean was not assembled by setup_runtime.sh" >&2
            exit 1
          fi
          mkdir -p "$NAZRIN_DIR/experiments/exprgraph/v3" "$NAZRIN_DIR/experiments/npa_data"
          cp -a "$OVERLAY_DIR/experiments/exprgraph/v3/validate_exprgraph_v3.py" \
            "$NAZRIN_DIR/experiments/exprgraph/v3/validate_exprgraph_v3.py"
          cp -a "$OVERLAY_DIR/experiments/npa_data/validate_structured_v4.py" \
            "$NAZRIN_DIR/experiments/npa_data/validate_structured_v4.py"
          cat paper-overlay/lakefile.schema4.append >> "$NAZRIN_DIR/lakefile.lean"
          grep -q 'lean_exe StructuredTraceV4' "$NAZRIN_DIR/lakefile.lean"
          grep -q 'lean_lib ExprGraphV3' "$NAZRIN_DIR/lakefile.lean"
          export PATH="$ELAN_HOME/bin:$PATH"
          cd "$NAZRIN_DIR"
          lake build StructuredTraceV4
          test -x "$NAZRIN_DIR/.lake/build/bin/StructuredTraceV4"

      - name: Plan deterministic contiguous shards
        id: plan
        env:
          SLICE_WINDOW: plan/input-window.tsv
          SHARD_COUNT: ${{ steps.validate.outputs.shard_count }}
        run: |
          set -Eeuo pipefail
          python3 scripts/plan_paper_shards.py \
            --input "$SLICE_WINDOW" \
            --output plan \
            --shards "$SHARD_COUNT"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path("plan/plan.json")
          plan = json.loads(path.read_text(encoding="utf-8"))
          include = [
              {
                  "id": shard["id"],
                  "label": f"{shard['id']:02d}",
                  "file": shard["file"],
                  "rows": shard["rows"],
                  "sha256": shard["sha256"],
              }
              for shard in plan["shards"]
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps({"include": include}, separators=(",", ":")) + "\n")
              output.write("plan_sha256=" + hashlib.sha256(path.read_bytes()).hexdigest() + "\n")
          PY

      - name: Record runtime identity
        run: |
          set -Eeuo pipefail
          export PATH="$ELAN_HOME/bin:$PATH"
          {
            echo "### Runtime identity"
            echo ""
            echo "- toolchain: \`$(cat "$NAZRIN_DIR/lean-toolchain")\`"
            echo "- exporter binary: \`$NAZRIN_DIR/.lake/build/bin/StructuredTraceV4\`"
            echo "- binary sha256: \`$(sha256sum "$NAZRIN_DIR/.lake/build/bin/StructuredTraceV4" | cut -d' ' -f1)\`"
            echo "- exporter source sha256: \`$(sha256sum "$NAZRIN_DIR/Standalone/StructuredTraceV4.lean" | cut -d' ' -f1)\`"
            echo "- window rows: ${{ steps.validate.outputs.window_rows }}"
          } >> "$GITHUB_STEP_SUMMARY"
          free -h

      - name: Upload immutable shard plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: schema4-plan-${{ github.run_id }}
          path: plan/
          include-hidden-files: true
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

  shards:
    name: Shard ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 480
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download immutable shard plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: schema4-plan-${{ github.run_id }}
          path: plan

      - name: Verify plan and assigned shard digest
        env:
          PLAN_SHA256: ${{ needs.prepare.outputs.plan_sha256 }}
          SHARD_ID: ${{ matrix.id }}
          SHARD_FILE: ${{ matrix.file }}
          SHARD_SHA256: ${{ matrix.sha256 }}
          SHARD_ROWS: ${{ matrix.rows }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          plan_path = Path("plan/plan.json")
          if hashlib.sha256(plan_path.read_bytes()).hexdigest() != os.environ["PLAN_SHA256"]:
              raise SystemExit("plan digest mismatch")
          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          shard_id = int(os.environ["SHARD_ID"])
          entry = next((item for item in plan["shards"] if item.get("id") == shard_id), None)
          name = os.environ["SHARD_FILE"]
          if entry is None or Path(name).name != name or entry.get("file") != name:
              raise SystemExit("assigned shard is absent from the plan")
          path = Path("plan") / name
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          if digest != entry["sha256"] or digest != os.environ["SHARD_SHA256"]:
              raise SystemExit("assigned shard digest mismatch")
          rows = sum(1 for _ in path.open(encoding="utf-8")) - 1
          if rows != int(os.environ["SHARD_ROWS"]):
              raise SystemExit("assigned shard row count mismatch")
          PY

      - name: Resolve pinned runtime manifest
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          manifest = json.loads(Path("runtime/manifest.json").read_text(encoding="utf-8"))
          if manifest.get("schema") != 1:
              raise SystemExit("runtime/manifest.json schema must be 1")
          source = manifest.get("source_commit")
          mathlib = manifest.get("mathlib_commit")
          for label, value in (("source_commit", source), ("mathlib_commit", mathlib)):
              if not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{40}", value):
                  raise SystemExit(f"runtime manifest {label} must be a full 40-character SHA")
          requested = os.environ["SOURCE_REF"]
          if requested.lower() != source:
              raise SystemExit(
                  f"requested source_ref {requested} is not the runtime-pinned {source}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"NAZRIN_SOURCE_REF={source}\n")
              handle.write(f"MATHLIB_COMMIT={mathlib}\n")
          PY

      - name: Bootstrap pinned Nazrin and Mathlib runtime
        timeout-minutes: 300
        env:
          GENERATE_INVENTORY: 'false'
        run: bash scripts/setup_runtime.sh

      - name: Apply schema-4 overlay and build the exporter
        env:
          OVERLAY_DIR: ${{ github.workspace }}/paper-overlay
        run: |
          set -Eeuo pipefail
          test -d "$NAZRIN_DIR/Standalone"
          test -f "$OVERLAY_DIR/lakefile.schema4.append"
          for name in GoalGraphCore.lean ExprGraphV2.lean ExprGraphV3.lean StructuredTraceV4.lean; do
            cp -a "$OVERLAY_DIR/Standalone/$name" "$NAZRIN_DIR/Standalone/$name"
          done
          if [[ ! -e "$NAZRIN_DIR/Standalone/AtomizerCore.lean" ]]; then
            echo "AtomizerCore.lean was not assembled by setup_runtime.sh" >&2
            exit 1
          fi
          mkdir -p "$NAZRIN_DIR/experiments/exprgraph/v3" "$NAZRIN_DIR/experiments/npa_data"
          cp -a "$OVERLAY_DIR/experiments/exprgraph/v3/validate_exprgraph_v3.py" \
            "$NAZRIN_DIR/experiments/exprgraph/v3/validate_exprgraph_v3.py"
          cp -a "$OVERLAY_DIR/experiments/npa_data/validate_structured_v4.py" \
            "$NAZRIN_DIR/experiments/npa_data/validate_structured_v4.py"
          cat paper-overlay/lakefile.schema4.append >> "$NAZRIN_DIR/lakefile.lean"
          grep -q 'lean_exe StructuredTraceV4' "$NAZRIN_DIR/lakefile.lean"
          export PATH="$ELAN_HOME/bin:$PATH"
          cd "$NAZRIN_DIR"
          lake build StructuredTraceV4
          test -x "$NAZRIN_DIR/.lake/build/bin/StructuredTraceV4"

      - name: Export one schema-4 trace shard
        id: export
        continue-on-error: true
        timeout-minutes: 300
        env:
          SHARD_ID: ${{ matrix.id }}
          SHARD_FILE: ${{ matrix.file }}
          LIMIT: ${{ needs.prepare.outputs.limit }}
          PLAN_SHA256: ${{ needs.prepare.outputs.plan_sha256 }}
          HEARTBEATS: ${{ inputs.heartbeats }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          export PATH="$ELAN_HOME/bin:$PATH"
          python3 scripts/run_schema4_shard.py \
            --slice "$GITHUB_WORKSPACE/plan/$SHARD_FILE" \
            --output-dir "$GITHUB_WORKSPACE/outputs/shard-$SHARD_ID" \
            --repo "$NAZRIN_DIR" \
            --jobs "$JOBS" \
            --timeout-seconds "$TIMEOUT_SECONDS" \
            --max-heartbeats "$HEARTBEATS" \
            --max-steps 3000 \
            --envelope-schema "$ENVELOPE_SCHEMA" \
            --run-id "$RUN_ID" \
            --shard-id "$SHARD_ID" \
            --plan-sha256 "$PLAN_SHA256" \
            --limit "$LIMIT" \
            --exporter-mode lean-run \
            --archive-work \
            --gzip-only

      - name: Show remaining runner resources
        if: always()
        run: |
          free -h
          df -h "$RUNNER_TEMP"

      - name: Upload shard artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: schema4-shard-${{ matrix.label }}-${{ github.run_id }}
          path: outputs/shard-${{ matrix.id }}/
          include-hidden-files: true
          if-no-files-found: warn
          overwrite: true
          compression-level: 0
          retention-days: 14

  merge:
    name: Validate and merge schema-4 artifacts
    needs: [prepare, shards]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download plan when available
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: schema4-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/plan

      - name: Download available shard artifacts
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: schema4-shard-*-${{ github.run_id }}
          path: ${{ runner.temp }}/downloaded-shards
          merge-multiple: false

      - name: Merge schema-4 shards
        env:
          EXPECTED_PLAN_SHA256: ${{ needs.prepare.outputs.plan_sha256 }}
          SHARD_COUNT: ${{ needs.prepare.outputs.shard_count }}
          LIMIT: ${{ needs.prepare.outputs.limit }}
          RUN_ID: ${{ github.run_id }}
          SLICE_PATH: ${{ inputs.slice }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -Eeuo pipefail
          python3 scripts/merge_schema4_artifacts.py \
            --plan "$RUNNER_TEMP/plan/plan.json" \
            --downloads "$RUNNER_TEMP/downloaded-shards" \
            --output "$RUNNER_TEMP/schema4-package" \
            --run-id "$RUN_ID" \
            --expected-plan-sha "$EXPECTED_PLAN_SHA256" \
            --shard-count "$SHARD_COUNT" \
            --limit "$LIMIT" \
            --slice "$SLICE_PATH" \
            --gzip-only \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Validate a merged-record sample (report only)
        continue-on-error: true
        timeout-minutes: 60
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/schema4-package" "$RUNNER_TEMP/validation-sample.jsonl" <<'PY'
          import gzip
          import sys
          from pathlib import Path

          package = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          source = package / "steps.jsonl"
          if not source.is_file():
              source = package / "steps.jsonl.gz"
          opener = gzip.open if source.suffix == ".gz" else open
          with opener(source, "rt", encoding="utf-8") as handle, \
                  destination.open("w", encoding="utf-8") as sample:
              for index, line in enumerate(handle):
                  if index >= 5000:
                      break
                  sample.write(line)
          print(f"sample from {source.name}: {index} step records")
          PY
          python3 paper-overlay/experiments/npa_data/validate_structured_v4.py \
            --stats "$RUNNER_TEMP/validation-sample.jsonl" \
            > "$RUNNER_TEMP/validation-sample.txt"
          cat "$RUNNER_TEMP/validation-sample.txt"
          cp "$RUNNER_TEMP/validation-sample.txt" "$RUNNER_TEMP/schema4-package/validation-sample.txt"
          {
            echo "### schema-4 sample validation"
            echo ""
            sed -n 's/^/    /p' "$RUNNER_TEMP/validation-sample.txt" | tail -n 40
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload schema-4 package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: schema4-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/schema4-package/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 30

      - name: Fail workflow if the package is incomplete
        if: always()
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "schema4-package/merge-report.json"
          if not path.is_file():
              raise SystemExit("schema-4 merge report is missing")
          report = json.loads(path.read_text(encoding="utf-8"))
          if report.get("complete") is not True:
              raise SystemExit(
                  "schema-4 package incomplete: "
                  f"{report.get('missing_shards')} missing, "
                  f"{report.get('invalid_shards')} invalid; inspect merge-report.json")
          print(
              f"Validated {report['totals']['accepted']}/{report['totals']['shards']} shards, "
              f"{report['totals']['theorems']} theorems, {report['totals']['steps']} steps")
          PY