name: Paper trace export

'on':
  workflow_dispatch:
    inputs:
      slice:
        description: Repository-relative theorem-list TSV with a theorem column
        required: true
        type: string
        default: paper-overlay/paper-slices/slice-00.tsv
      shard_count:
        description: Number of contiguous deterministic shards (1 to 20)
        required: true
        type: number
        default: 10
      max_parallel:
        description: Maximum simultaneous shard jobs (1 to 20)
        required: true
        type: number
        default: 10
      limit:
        description: 每 shard 最大 theorem 行数（0=全部）
        required: true
        type: number
        default: 0
      source_ref:
        description: Full pinned Codeberg Nazrin base commit SHA
        required: true
        type: string
        default: e34a0535fc767479f7939a98f5699b1a6513a919
      mathlib_commit:
        description: Full pinned Mathlib commit SHA
        required: true
        type: string
        default: 5e932f97dd25535344f80f9dd8da3aab83df0fe6
      runner_label:
        description: Linux x64 runner label with sufficient memory and disk
        required: true
        type: string
        default: ubuntu-24.04

permissions:
  contents: read

concurrency:
  group: paper-trace-export-${{ github.run_id }}
  cancel-in-progress: false

env:
  NAZRIN_SOURCE_URL: https://codeberg.org/aniva/Nazrin.git
  NAZRIN_SOURCE_REF: ${{ inputs.source_ref }}
  MATHLIB_COMMIT: ${{ inputs.mathlib_commit }}
  LEAN_TASK_MANAGER_WORKERS: '2'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  prepare:
    name: Build exporter and plan shards
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 360
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
      max_parallel: ${{ steps.validate.outputs.max_parallel }}
      shard_count: ${{ steps.validate.outputs.shard_count }}
      limit: ${{ steps.validate.outputs.limit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Record export limits in job summary
        run: |
          {
            echo "### Paper trace export limits"
            echo ""
            echo "- Theorem rows per shard: \`limit\` input (default 0 = all rows)"
            echo "- Heartbeats per theorem: 1,000,000 by default (\`NAZRIN_TRACE_MAX_HEARTBEATS\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate dispatch inputs and slice path
        id: validate
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          MATHLIB_COMMIT: ${{ inputs.mathlib_commit }}
          SHARD_COUNT: ${{ inputs.shard_count }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
          LIMIT: ${{ inputs.limit }}
          RUNNER_LABEL: ${{ inputs.runner_label }}
          SLICE_PATH: ${{ inputs.slice }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          for name in ("SOURCE_REF", "MATHLIB_COMMIT"):
              if not re.fullmatch(r"[0-9a-fA-F]{40}", os.environ[name]):
                  raise SystemExit(f"{name} must be a full 40-character Git commit SHA")
          for name, low, high in (("SHARD_COUNT", 1, 20), ("MAX_PARALLEL", 1, 20)):
              value = os.environ[name]
              if not value.isdecimal() or not low <= int(value) <= high:
                  raise SystemExit(f"{name} must be an integer from {low} to {high}")
          limit = os.environ["LIMIT"]
          if not limit.isdecimal() or int(limit) > 1_000_000:
              raise SystemExit("LIMIT must be an integer from 0 to 1000000")
          if not re.fullmatch(r"[A-Za-z0-9._/-]+", os.environ["RUNNER_LABEL"]):
              raise SystemExit("RUNNER_LABEL contains unsupported characters")

          raw = os.environ["SLICE_PATH"]
          relative = Path(raw)
          if not raw or relative.is_absolute() or ".." in relative.parts:
              raise SystemExit("SLICE_PATH must be a repository-relative path without '..'")
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          candidate = workspace / relative
          if candidate.is_symlink():
              raise SystemExit("SLICE_PATH must not be a symlink")
          try:
              candidate = candidate.resolve(strict=True)
          except FileNotFoundError:
              raise SystemExit(f"SLICE_PATH does not exist: {raw}") from None
          try:
              candidate.relative_to(workspace)
          except ValueError:
              raise SystemExit("SLICE_PATH escapes the repository workspace") from None
          if not candidate.is_file():
              raise SystemExit("SLICE_PATH must name a regular file")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"slice={candidate.relative_to(workspace).as_posix()}\n")
              output.write(f"shard_count={int(os.environ['SHARD_COUNT'])}\n")
              output.write(f"max_parallel={int(os.environ['MAX_PARALLEL'])}\n")
              output.write(f"limit={int(limit)}\n")
          PY

      - name: Verify overlay checksums
        run: |
          set -Eeuo pipefail
          cd paper-overlay
          sha256sum -c SHA256SUMS

      - name: Run paper shard unit tests
        run: python3 -B -m unittest discover -s tests -p 'test_*paper_shards.py' -v

      - name: Bootstrap pinned Nazrin and Mathlib runtime
        timeout-minutes: 300
        env:
          GENERATE_INVENTORY: 'false'
        run: bash scripts/setup_runtime.sh

      - name: Apply paper trace overlay and append Lake targets
        env:
          OVERLAY_DIR: ${{ github.workspace }}/paper-overlay
        run: |
          set -Eeuo pipefail
          test -d "$NAZRIN_DIR/Standalone"
          test -f "$OVERLAY_DIR/lakefile.append"
          for name in GoalGraphCore.lean ExprGraphExport.lean PaperTraceExport.lean; do
            cp -a "$OVERLAY_DIR/Standalone/$name" "$NAZRIN_DIR/Standalone/$name"
          done
          if [[ ! -e "$NAZRIN_DIR/Standalone/AtomizerCore.lean" ]]; then
            cp -a "$OVERLAY_DIR/Standalone/AtomizerCore.lean" "$NAZRIN_DIR/Standalone/AtomizerCore.lean"
          fi
          mkdir -p "$NAZRIN_DIR/experiments/npa_data"
          cp -a "$OVERLAY_DIR/experiments/npa_data/convert_trace.py" \
            "$NAZRIN_DIR/experiments/npa_data/convert_trace.py"
          (
            cd "$GITHUB_WORKSPACE"
            cat paper-overlay/lakefile.append >> "$NAZRIN_DIR/lakefile.lean"
          )
          grep -q 'lean_exe PaperTraceExport' "$NAZRIN_DIR/lakefile.lean"
          grep -q 'lean_exe ExprGraphExport' "$NAZRIN_DIR/lakefile.lean"

      - name: Build PaperTraceExport
        run: |
          set -Eeuo pipefail
          export PATH="$ELAN_HOME/bin:$PATH"
          cd "$NAZRIN_DIR"
          lake build PaperTraceExport

      - name: Plan deterministic contiguous shards
        id: plan
        env:
          SLICE_PATH: ${{ steps.validate.outputs.slice }}
          SHARD_COUNT: ${{ steps.validate.outputs.shard_count }}
        run: |
          set -Eeuo pipefail
          python3 scripts/plan_paper_shards.py \
            --input "$SLICE_PATH" \
            --output plan \
            --shards "$SHARD_COUNT"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path("plan/plan.json")
          plan = json.loads(path.read_text(encoding="utf-8"))
          include = [
              {
                  "id": shard["id"],
                  "label": f"{shard['id']:02d}",
                  "file": shard["file"],
                  "rows": shard["rows"],
                  "sha256": shard["sha256"],
              }
              for shard in plan["shards"]
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps({"include": include}, separators=(",", ":")) + "\n")
              output.write("plan_sha256=" + hashlib.sha256(path.read_bytes()).hexdigest() + "\n")
          PY

      - name: Upload immutable shard plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paper-trace-plan-${{ github.run_id }}
          path: plan/
          include-hidden-files: true
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

  shards:
    name: Shard ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download immutable shard plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: paper-trace-plan-${{ github.run_id }}
          path: plan

      - name: Verify plan and assigned shard digest
        env:
          PLAN_SHA256: ${{ needs.prepare.outputs.plan_sha256 }}
          SHARD_ID: ${{ matrix.id }}
          SHARD_FILE: ${{ matrix.file }}
          SHARD_SHA256: ${{ matrix.sha256 }}
          SHARD_ROWS: ${{ matrix.rows }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          plan_path = Path("plan/plan.json")
          if hashlib.sha256(plan_path.read_bytes()).hexdigest() != os.environ["PLAN_SHA256"]:
              raise SystemExit("plan digest mismatch")
          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          shard_id = int(os.environ["SHARD_ID"])
          entry = next((item for item in plan["shards"] if item.get("id") == shard_id), None)
          name = os.environ["SHARD_FILE"]
          if entry is None or Path(name).name != name or entry.get("file") != name:
              raise SystemExit("assigned shard is absent from the plan")
          path = Path("plan") / name
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          if digest != entry["sha256"] or digest != os.environ["SHARD_SHA256"]:
              raise SystemExit("assigned shard digest mismatch")
          rows = sum(1 for _ in path.open(encoding="utf-8")) - 1
          if rows != int(os.environ["SHARD_ROWS"]):
              raise SystemExit("assigned shard row count mismatch")
          PY

      - name: Bootstrap pinned Nazrin and Mathlib runtime
        timeout-minutes: 300
        env:
          GENERATE_INVENTORY: 'false'
        run: bash scripts/setup_runtime.sh

      - name: Apply paper trace overlay and append Lake targets
        env:
          OVERLAY_DIR: ${{ github.workspace }}/paper-overlay
        run: |
          set -Eeuo pipefail
          test -d "$NAZRIN_DIR/Standalone"
          test -f "$OVERLAY_DIR/lakefile.append"
          for name in GoalGraphCore.lean ExprGraphExport.lean PaperTraceExport.lean; do
            cp -a "$OVERLAY_DIR/Standalone/$name" "$NAZRIN_DIR/Standalone/$name"
          done
          if [[ ! -e "$NAZRIN_DIR/Standalone/AtomizerCore.lean" ]]; then
            cp -a "$OVERLAY_DIR/Standalone/AtomizerCore.lean" "$NAZRIN_DIR/Standalone/AtomizerCore.lean"
          fi
          mkdir -p "$NAZRIN_DIR/experiments/npa_data"
          cp -a "$OVERLAY_DIR/experiments/npa_data/convert_trace.py" \
            "$NAZRIN_DIR/experiments/npa_data/convert_trace.py"
          (
            cd "$GITHUB_WORKSPACE"
            cat paper-overlay/lakefile.append >> "$NAZRIN_DIR/lakefile.lean"
          )
          grep -q 'lean_exe PaperTraceExport' "$NAZRIN_DIR/lakefile.lean"
          grep -q 'lean_exe ExprGraphExport' "$NAZRIN_DIR/lakefile.lean"

      - name: Build PaperTraceExport
        run: |
          set -Eeuo pipefail
          export PATH="$ELAN_HOME/bin:$PATH"
          cd "$NAZRIN_DIR"
          lake build PaperTraceExport

      - name: Export one paper trace shard
        timeout-minutes: 300
        env:
          SHARD_ID: ${{ matrix.id }}
          SHARD_FILE: ${{ matrix.file }}
          LIMIT: ${{ needs.prepare.outputs.limit }}
          NAZRIN_TRACE_MAX_HEARTBEATS: '1000000'
        run: |
          set -Eeuo pipefail
          export PATH="$ELAN_HOME/bin:$PATH"
          output="$GITHUB_WORKSPACE/outputs/shard-$SHARD_ID"
          mkdir -p "$output"
          cp "$GITHUB_WORKSPACE/plan/$SHARD_FILE" "$output/shard.tsv"
          executable="$NAZRIN_DIR/.lake/build/bin/PaperTraceExport"
          test -x "$executable"
          cd "$MATHLIB_PROJECT_DIR"
          if (( LIMIT > 0 )); then
            "$executable" Mathlib "$GITHUB_WORKSPACE/plan/$SHARD_FILE" "$output" "$LIMIT"
          else
            "$executable" Mathlib "$GITHUB_WORKSPACE/plan/$SHARD_FILE" "$output"
          fi

      - name: Show remaining runner resources
        if: always()
        run: |
          free -h
          df -h "$RUNNER_TEMP"

      - name: Upload shard traces including hidden files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paper-trace-shard-${{ matrix.label }}-${{ github.run_id }}
          path: outputs/shard-${{ matrix.id }}/
          include-hidden-files: true
          if-no-files-found: warn
          overwrite: true
          compression-level: 1
          retention-days: 14

  package:
    name: Validate and package traces
    needs: [prepare, shards]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download plan when available
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: paper-trace-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/plan

      - name: Download available shard artifacts
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: paper-trace-shard-*-${{ github.run_id }}
          path: ${{ runner.temp }}/downloaded-shards
          merge-multiple: false

      - name: Validate metadata and merge trace JSONL
        env:
          EXPECTED_PLAN_SHA256: ${{ needs.prepare.outputs.plan_sha256 }}
          RUNNER_TEMP: ${{ runner.temp }}
          RUN_ID: ${{ github.run_id }}
          SHARD_COUNT: ${{ inputs.shard_count }}
          LIMIT: ${{ inputs.limit }}
          SOURCE_REF: ${{ inputs.source_ref }}
          MATHLIB_COMMIT: ${{ inputs.mathlib_commit }}
          SLICE_PATH: ${{ inputs.slice }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          SHARDS_RESULT: ${{ needs.shards.result }}
        run: |
          set -Eeuo pipefail
          python3 scripts/package_paper_shards.py \
            --plan "$RUNNER_TEMP/plan/plan.json" \
            --downloads "$RUNNER_TEMP/downloaded-shards" \
            --output "$RUNNER_TEMP/paper-package" \
            --run-id "$RUN_ID" \
            --limit "$LIMIT" \
            --expected-plan-sha "$EXPECTED_PLAN_SHA256" \
            --shard-count "$SHARD_COUNT" \
            --source-ref "$SOURCE_REF" \
            --mathlib-commit "$MATHLIB_COMMIT" \
            --slice "$SLICE_PATH" \
            --prepare-result "$PREPARE_RESULT" \
            --shards-result "$SHARDS_RESULT" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload paper trace package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paper-trace-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paper-package/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 30

      - name: Fail workflow if any shard is missing or invalid
        if: always()
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "paper-package/package-report.json"
          if not path.is_file():
              raise SystemExit("paper trace package report is missing")
          report = json.loads(path.read_text(encoding="utf-8"))
          if report.get("complete") is not True:
              raise SystemExit("paper trace package incomplete; inspect package-report.json")
          print(
              f"Validated {len(report['shards'])} shards and "
              f"{report['totals']['steps']} total steps"
          )
          PY
