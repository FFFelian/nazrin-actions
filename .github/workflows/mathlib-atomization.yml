name: Mathlib atomization

'on':
  workflow_dispatch:
    inputs:
      source_repository:
        description: HTTPS Codeberg repository exposing the compatible worker contract
        type: string
        required: true
        default: https://codeberg.org/aniva/Nazrin.git
      source_ref:
        description: Full 40-character Codeberg commit SHA implementing the compatible worker contract
        type: string
        required: true
      mathlib_commit:
        description: Full Mathlib commit SHA pinned by the compatible source project
        type: string
        required: true
        default: 5e932f97dd25535344f80f9dd8da3aab83df0fe6
      shard_count:
        description: Number of deterministic theorem shards (1 to 128, default 10)
        type: number
        required: true
        default: 10
      max_parallel:
        description: Maximum simultaneous shard jobs (1 to 10)
        type: number
        required: true
        default: 10
      scan_minutes:
        description: Maximum scan time per shard after setup (1 to 300 minutes)
        type: number
        required: true
        default: 300
      runner_label:
        description: Linux x64 runner label with sufficient memory and disk
        type: string
        required: true
        default: ubuntu-24.04

permissions:
  contents: read

concurrency:
  group: mathlib-atomization-${{ github.run_id }}
  cancel-in-progress: false

env:
  NAZRIN_SOURCE_URL: ${{ inputs.source_repository }}
  NAZRIN_SOURCE_REF: ${{ inputs.source_ref }}
  MATHLIB_COMMIT: ${{ inputs.mathlib_commit }}
  LEAN_TASK_MANAGER_WORKERS: '2'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  prepare:
    name: Build complete inventory and shard plan
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 360
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
      max_parallel: ${{ steps.validate.outputs.max_parallel }}
      shard_count: ${{ steps.validate.outputs.shard_count }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download prior plan when rerunning this workflow
        id: restore_plan
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: atomization-plan-${{ github.run_id }}-${{ inputs.source_ref }}-${{ inputs.mathlib_commit }}
          path: plan
      - name: Require restored plan on later attempts
        if: github.run_attempt > 1 && steps.restore_plan.outcome != 'success'
        run: |
          echo 'Prior plan restore failed; preserve existing artifacts and use a new dispatch if no prior plan exists.' >&2
          exit 1
      - name: Validate dispatch inputs
        id: validate
        env:
          SHARD_COUNT: ${{ inputs.shard_count }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
          SCAN_MINUTES: ${{ inputs.scan_minutes }}
        run: |
          python3 - <<'PY'
          import os, re
          from urllib.parse import urlsplit
          for name in ("NAZRIN_SOURCE_REF", "MATHLIB_COMMIT"):
              if not re.fullmatch(r"[0-9a-fA-F]{40}", os.environ[name]):
                  raise SystemExit(f"{name} must be a full 40-character Git commit SHA")
          source = urlsplit(os.environ["NAZRIN_SOURCE_URL"])
          if (source.scheme != "https" or source.netloc != "codeberg.org" or source.query or source.fragment
                  or source.path != "/aniva/Nazrin.git"):
              raise SystemExit("source_repository must be https://codeberg.org/aniva/Nazrin.git")
          ranges = (("SHARD_COUNT", 1, 128), ("MAX_PARALLEL", 1, 10), ("SCAN_MINUTES", 1, 300))
          values = {}
          for key, low, high in ranges:
              value = os.environ[key]
              if not value.isdecimal() or not low <= int(value) <= high:
                  raise SystemExit(f"{key} must be an integer from {low} to {high}")
              values[key] = int(value)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"shard_count={values['SHARD_COUNT']}\n")
              output.write(f"max_parallel={values['MAX_PARALLEL']}\n")
          PY
      - name: Run orchestration unit tests
        run: python3 -B -m unittest discover -s tests -v
      - name: Bootstrap pinned source, worker and full Mathlib inventory
        timeout-minutes: 300
        run: bash scripts/setup_runtime.sh
      - name: Plan exact nonoverlapping shards
        id: plan
        env:
          SHARD_COUNT: ${{ inputs.shard_count }}
        run: |
          python3 scripts/plan_shards.py \
            --inventory "$FULL_INVENTORY" --output plan \
            --shards "$SHARD_COUNT" --source-commit "$NAZRIN_SOURCE_REF"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          path = Path("plan/plan.json")
          plan = json.loads(path.read_text(encoding="utf-8"))
          matrix = {"include": plan["shards"]}
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
              output.write("plan_sha256=" + hashlib.sha256(path.read_bytes()).hexdigest() + "\n")
          PY
      - name: Upload immutable plan and canonical inventory
        if: always() && (github.run_attempt == 1 || steps.restore_plan.outcome == 'success')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atomization-plan-${{ github.run_id }}-${{ inputs.source_ref }}-${{ inputs.mathlib_commit }}
          path: plan/
          include-hidden-files: true
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

  shards:
    name: Shard ${{ matrix.id }}
    needs: prepare
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Start shard wall-clock budget
        run: echo "SHARD_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download immutable shard plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: atomization-plan-${{ github.run_id }}-${{ inputs.source_ref }}-${{ inputs.mathlib_commit }}
          path: plan
      - name: Restore this shard output when rerunning failed jobs
        id: restore_shard
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: atomization-shard-${{ matrix.id }}-${{ github.run_id }}-${{ inputs.source_ref }}-${{ inputs.mathlib_commit }}
          path: outputs/shard-${{ matrix.id }}
      - name: Require restored shard on later attempts
        if: github.run_attempt > 1 && steps.restore_shard.outcome != 'success'
        run: |
          echo 'Prior shard restore failed; preserve existing results and use a new dispatch if no prior shard exists.' >&2
          exit 1
      - name: Verify plan and assigned shard inventory digests
        env:
          PLAN_SHA256: ${{ needs.prepare.outputs.plan_sha256 }}
          SHARD_ID: ${{ matrix.id }}
          SHARD_INVENTORY: ${{ matrix.inventory }}
          SHARD_SHA256: ${{ matrix.sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          path = Path("plan/plan.json")
          if hashlib.sha256(path.read_bytes()).hexdigest() != os.environ["PLAN_SHA256"]:
              raise SystemExit("plan digest mismatch")
          plan = json.loads(path.read_text(encoding="utf-8"))
          if plan["source_commit"] != os.environ["NAZRIN_SOURCE_REF"].lower():
              raise SystemExit("plan source commit mismatch")
          shard_id = int(os.environ["SHARD_ID"])
          entry = next((row for row in plan["shards"] if row.get("id") == shard_id), None)
          name = os.environ["SHARD_INVENTORY"]
          if entry is None or Path(name).name != name or name != entry["inventory"]:
              raise SystemExit("invalid assigned shard inventory")
          digest = hashlib.sha256((Path("plan") / name).read_bytes()).hexdigest()
          if digest != entry["sha256"] or digest != os.environ["SHARD_SHA256"]:
              raise SystemExit("shard inventory digest mismatch")
          PY
      - name: Bootstrap pinned source and Mathlib runtime
        timeout-minutes: 75
        env:
          GENERATE_INVENTORY: 'false'
        run: bash scripts/setup_runtime.sh
      - name: Run one theorem worker with two Lean internal workers
        env:
          SHARD_ID: ${{ matrix.id }}
          SHARD_COUNT: ${{ needs.prepare.outputs.shard_count }}
          SHARD_INVENTORY: ${{ matrix.inventory }}
          SCAN_MINUTES: ${{ inputs.scan_minutes }}
        run: |
          export PATH="$ELAN_HOME/bin:$PATH"
          runtime_seconds=$(python3 - <<'PY'
          import os, time
          remaining = int(os.environ["SHARD_JOB_STARTED"]) + 350 * 60 - int(time.time()) - 15 * 60
          if remaining <= 0:
              raise SystemExit("setup exhausted the shard budget; the plan artifact retains all candidates")
          print(min(int(os.environ["SCAN_MINUTES"]) * 60, remaining))
          PY
          )
          python3 scripts/run_shard.py \
            --inventory "plan/$SHARD_INVENTORY" \
            --output "outputs/shard-$SHARD_ID" \
            --source "$NAZRIN_DIR" --project "$MATHLIB_PROJECT_DIR" \
            --source-commit "$NAZRIN_SOURCE_REF" \
            --shard-id "$SHARD_ID" --shard-count "$SHARD_COUNT" \
            --timeout-seconds 30 --internal-workers 2 --memory-gib 10 \
            --import-module Mathlib --max-runtime-seconds "$runtime_seconds" \
            --grace-seconds 180
      - name: Show remaining runner resources
        if: always()
        run: |
          free -h
          df -h "$RUNNER_TEMP"
      - name: Upload shard results including hidden supervisor state
        if: always() && (github.run_attempt == 1 || steps.restore_shard.outcome == 'success')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atomization-shard-${{ matrix.id }}-${{ github.run_id }}-${{ inputs.source_ref }}-${{ inputs.mathlib_commit }}
          path: outputs/shard-${{ matrix.id }}/
          include-hidden-files: true
          if-no-files-found: warn
          overwrite: true
          compression-level: 1
          retention-days: 14

  package:
    needs: [prepare, shards]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download plan when available
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: atomization-plan-${{ github.run_id }}-${{ inputs.source_ref }}-${{ inputs.mathlib_commit }}
          path: ${{ runner.temp }}/plan
      - name: Download available shard artifacts
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: atomization-shard-*-${{ github.run_id }}-${{ inputs.source_ref }}-${{ inputs.mathlib_commit }}
          path: ${{ runner.temp }}/downloaded-shards
          merge-multiple: false
      - name: Validate coverage and package available results
        env:
          EXPECTED_PLAN_SHA256: ${{ needs.prepare.outputs.plan_sha256 }}
          RUNNER_TEMP: ${{ runner.temp }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          SHARDS_RESULT: ${{ needs.shards.result }}
          SHARD_COUNT: ${{ inputs.shard_count }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, sys, tarfile
          from pathlib import Path
          sys.path.insert(0, str(Path("scripts").resolve()))
          from package_run import package, _copy_tree_without_symlinks
          root = Path(os.environ["RUNNER_TEMP"])
          plan_dir = root / "plan"
          plan = plan_dir / "plan.json"
          artifacts = root / "downloaded-shards"
          artifacts.mkdir(parents=True, exist_ok=True)
          output = root / "final-package"
          try:
              if not plan.is_file():
                  raise ValueError("canonical plan unavailable; source verification or planning failed")
              if hashlib.sha256(plan.read_bytes()).hexdigest() != os.environ["EXPECTED_PLAN_SHA256"]:
                  raise ValueError("plan digest mismatch")
              report = package(plan, artifacts, output)
          except Exception as exc:
              content = output / "package-content"
              content.mkdir(parents=True, exist_ok=True)
              if plan_dir.is_dir() and any(plan_dir.iterdir()):
                  _copy_tree_without_symlinks(plan_dir, content / "unvalidated-plan")
              if any(artifacts.iterdir()):
                  _copy_tree_without_symlinks(artifacts, content / "unvalidated-artifacts")
              raw_count = os.environ.get("SHARD_COUNT", "")
              missing_shards = (list(range(int(raw_count)))
                                if raw_count.isdecimal() and len(raw_count) <= 3
                                and 1 <= int(raw_count) <= 128 else None)
              report = {
                  "schema": 1, "status": "incomplete", "complete": False,
                  "issues": [str(exc)], "missing_shards": missing_shards,
                  "inventory_rows": None, "pending_rows": None,
                  "prepare_result": os.environ["PREPARE_RESULT"],
                  "shards_result": os.environ["SHARDS_RESULT"],
              }
              (content / "package-report.json").write_text(json.dumps(report, indent=2) + "\n")
              (content / "pending-inventory.tsv").write_text("index\ttheorem\tmodule\n")
              output.mkdir(parents=True, exist_ok=True)
              with tarfile.open(output / "nazrin-atomization-results.tar.gz", "w:gz") as archive:
                  archive.add(content, arcname="nazrin-atomization-results")
          summary = (f"Atomization package complete: **{report['complete']}**\n\n"
                     f"Terminal rows: {report.get('completed_terminal_rows', 'unknown')}; "
                     f"pending rows: {report.get('pending_rows', 'unknown')}.\n\n"
                     "Failure, timeout and crash are terminal attempts, not successful traces.\n")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(summary, encoding="utf-8")
          PY
      - name: Upload package before enforcing completeness
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atomization-package-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.source_ref }}-${{ inputs.mathlib_commit }}
          path: ${{ runner.temp }}/final-package/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 30
      - name: Fail workflow if coverage is incomplete
        if: always()
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report_path = Path(os.environ["RUNNER_TEMP"]) / "final-package/package-content/package-report.json"
          report = json.loads(report_path.read_text())
          if report.get("complete") is not True:
              raise SystemExit("Atomization incomplete; download final package and pending inventory")
          PY
